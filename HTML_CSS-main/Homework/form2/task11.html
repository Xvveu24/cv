<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #f0f2f5;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .login-box {
        background: white;
        border-radius: 10px;
        padding: 40px 36px;
        width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .login-title {
        font-size: 22px;
        font-weight: bold;
        color: #222;
        margin-bottom: 6px;
    }

    .login-sub {
        font-size: 13px;
        color: #999;
        margin-bottom: 28px;
    }

    .field-wrap {
        margin-bottom: 16px;
    }

    .field-label {
        font-size: 12px;
        color: #888;
        margin-bottom: 6px;
        display: block;
    }

    .field-inp {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
        color: #333;
    }

    .field-inp:focus {
        border-color: #5b6ef5;
    }

    .field-inp::placeholder {
        color: #ccc;
    }

    .btn-login {
        width: 100%;
        background: #5b6ef5;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s;
    }

    .btn-login:hover {
        background: #4455e0;
    }

    .forgot-link {
        display: block;
        text-align: center;
        margin-top: 14px;
        font-size: 13px;
        color: #5b6ef5;
        text-decoration: none;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 18px;
    }

    .divider-line {
        flex: 1;
        height: 1px;
        background: #eee;
    }

    .divider-txt {
        font-size: 12px;
        color: #bbb;
    }

    .social-btns {
        display: flex;
        gap: 10px;
    }

    .btn-social {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 0;
        background: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        color: #444;
        transition: background 0.15s, border-color 0.15s;
    }

    .btn-social:hover {
        background: #f7f7f7;
        border-color: #bbb;
    }

    .btn-social svg {
        width: 18px;
        height: 18px;
    }
</style>

</head>
<body>
    <div class="login-box">
        <div class="login-title">Welcome back</div>
        <div class="login-sub">Please enter your details to sign in</div>
    <div class="field-wrap">
        <label class="field-label">Login</label>
        <input class="field-inp" type="text" placeholder="Enter your login">
    </div>

    <div class="field-wrap">
        <label class="field-label">Password</label>
        <input class="field-inp" type="password" placeholder="Enter your password">
    </div>

    <button class="btn-login">Sign In</button>

    <a href="#" class="forgot-link">Forgot password?</a>

    <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-txt">or continue with</div>
        <div class="divider-line"></div>
    </div>

    <div class="social-btns">
        <button class="btn-social">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
        </button>
        <button class="btn-social">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
            </svg>
            Facebook
        </button>
        <button class="btn-social">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="#000"/>
            </svg>
            X
        </button>
    </div>
</div>

</body>
</html>
