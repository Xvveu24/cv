<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <main class="card">
    <section class="result">
      <h1>Your Result</h1>

      <div class="score-circle">
        <strong>76</strong>
        <span>of 100</span>
      </div>

      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="summary">
      <h2>Summary</h2>

      <div class="summary-list">
        <div class="summary-item reaction">
          <div>
            <img src="./assets/images/icon-reaction.svg" alt="">
            <span>Reaction</span>
          </div>
          <p><strong>80</strong> / 100</p>
        </div>

        <div class="summary-item memory">
          <div>
            <img src="./assets/images/icon-memory.svg" alt="">
            <span>Memory</span>
          </div>
          <p><strong>92</strong> / 100</p>
        </div>

        <div class="summary-item verbal">
          <div>
            <img src="./assets/images/icon-verbal.svg" alt="">
            <span>Verbal</span>
          </div>
          <p><strong>61</strong> / 100</p>
        </div>

        <div class="summary-item visual">
          <div>
            <img src="./assets/images/icon-visual.svg" alt="">
            <span>Visual</span>
          </div>
          <p><strong>72</strong> / 100</p>
        </div>
      </div>

      <button>Continue</button>
    </section>
  </main>
</body>
</html>
