<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Головна сторінка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="border-bottom bg-white">
    <nav class="navbar navbar-expand-lg container py-3">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="icons_practice_module_12/ad.png" alt="logo" width="42">
        <span class="fw-bold">Good Ads</span>
      </a>

      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="btn btn-primary" href="#">Додати оголошення</a>
        <a class="text-decoration-none text-dark d-flex align-items-center gap-2" href="#">
          <img src="icons_practice_module_12/account.png" alt="profile" width="32" height="32">
          Профіль
        </a>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <section class="bg-white border rounded p-4 p-md-5 mb-5">
      <h1 class="h2 mb-4 text-center">Знайдіть потрібне оголошення</h1>

      <form class="row g-3">
        <div class="col-md-5">
          <input class="form-control form-control-lg" type="text" placeholder="Що шукаєте?">
        </div>
        <div class="col-md-4">
          <input class="form-control form-control-lg" type="text" placeholder="Місто або область">
        </div>
        <div class="col-md-3 d-grid">
          <button class="btn btn-primary btn-lg" type="submit">Пошук</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="h4 mb-4">Категорії</h2>

      <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3">
          <a class="category-link bg-white border rounded p-3 text-center" href="#">
            <img src="icons_practice_module_12/furniture_1.png" alt="furniture" width="64" height="64">
            <span>Меблі</span>
          </a>
        </div>
        <div class="col-6 col-md-4 col-lg-3">
          <a class="category-link bg-white border rounded p-3 text-center" href="#">
            <img src="icons_practice_module_12/ad.png" alt="electronics" width="64" height="64">
            <span>Техніка</span>
          </a>
        </div>
        <div class="col-6 col-md-4 col-lg-3">
          <a class="category-link bg-white border rounded p-3 text-center" href="#">
            <img src="icons_practice_module_12/furniture_2.png" alt="home" width="64" height="64">
            <span>Дім і сад</span>
          </a>
        </div>
        <div class="col-6 col-md-4 col-lg-3">
          <a class="category-link bg-white border rounded p-3 text-center" href="#">
            <img src="icons_practice_module_12/furniture_3.png" alt="other" width="64" height="64">
            <span>Інше</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white-50 py-4 mt-4">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-3">
          <img src="icons_practice_module_12/ad_bw.png" alt="logo" width="56">
          <p class="mt-2 mb-0">Good Ads</p>
        </div>
        <div class="col-md-3">
          <h3 class="h6 text-white">Компанія</h3>
          <a class="footer-link" href="#">Про нас</a>
          <a class="footer-link" href="#">Допомога</a>
        </div>
        <div class="col-md-3">
          <h3 class="h6 text-white">Оголошення</h3>
          <a class="footer-link" href="#">Категорії</a>
          <a class="footer-link" href="#">Правила</a>
        </div>
        <div class="col-md-3">
          <h3 class="h6 text-white">Контакти</h3>
          <a class="footer-link" href="#">Підтримка</a>
          <a class="footer-link" href="#">Соцмережі</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
